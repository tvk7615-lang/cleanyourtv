
name: Build CleanYourTV APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build CleanYourTV
    runs-on: ubuntu-latest

    steps:
      # Descargar el repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # Configurar Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Configurar Android SDK y aceptar licencias
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platforms;android-34 build-tools;34.0.0'

      # Preparar Gradle
      - name: Prepare Gradle
        working-directory: launcher
        run: chmod +x gradlew

      # Compilar CleanYourTV
      - name: Build CleanYourTV APK
        working-directory: launcher
        run: ./gradlew assembleRelease --no-daemon

      # Verificar que el APK existe
      - name: Verify APK
        run: |
          APK="launcher/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "ERROR: No se encontró el APK"
            exit 1
          fi
          echo "APK generado correctamente"
          ls -lh "$APK"

      # Subir el APK a GitHub
      - name: Upload CleanYourTV APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV-APK
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
